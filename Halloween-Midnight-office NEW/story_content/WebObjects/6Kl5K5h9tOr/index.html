<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Midnight Office — Start</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#080c10;color:#eee9e1;font-family:Arial,sans-serif}main{height:100svh;min-height:520px;position:relative;overflow:hidden;display:flex;align-items:center}#office{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(.75) brightness(.85)}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#080d13fa 0%,#080d13eb 35%,#080d1380 75%,#080d1340),linear-gradient(0deg,#080d13cc,transparent 40%)}.frame{position:absolute;inset:24px;border:1px solid #ffffff12;pointer-events:none}.content{position:relative;padding:6vh 8vw;width:min(970px,100%);animation:enter 1.6s ease both}.eyebrow{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.23em;line-height:1.8;color:#e5aa70}.eyebrow:before{content:"";width:30px;height:1px;background:#e5aa70}h1{font-family:Georgia,serif;font-weight:normal;font-size:clamp(44px,7.5vw,102px);letter-spacing:.025em;line-height:1.04;margin:28px 0}.tagline{font-size:clamp(15px,1.6vw,19px);line-height:1.7;color:#b9c1c8;max-width:380px}.start{margin-top:24px;padding:17px 26px;min-height:52px;border:1px solid #e5aa7070;background:#e5aa7010;color:#f0c397;font:14px Arial,sans-serif;letter-spacing:.05em;cursor:pointer;transition:.25s;display:inline-flex;gap:45px;align-items:center;border-radius:3px}.start:hover{background:#e5aa70;color:#111820;box-shadow:0 0 35px #e5aa7018}.start:focus-visible{outline:3px solid white;outline-offset:6px}.meta{font-size:11px;color:#8e9aa7;letter-spacing:.06em;margin-top:20px}.footer{position:absolute;bottom:35px;right:45px;color:#81909d;font-size:10px;letter-spacing:.15em}.status{font-size:13px;color:#f0c397;max-width:430px;line-height:1.6}.exit{opacity:0;transition:opacity .55s} @keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:600px){.content{padding:48px 9vw}.eyebrow{font-size:9px}.frame{inset:14px}.footer{bottom:24px;right:26px;font-size:8px}h1{margin:22px 0}.start{margin-top:14px}}@media(prefers-reduced-motion:reduce){.content{animation:none}*{transition:none!important}}
.sound{position:absolute;top:40px;right:42px;z-index:4;background:#0c141bd9;border:1px solid #ffffff35;color:#c9d0d7;padding:10px 14px;border-radius:4px;font:12px Arial,sans-serif;cursor:pointer}.sound:focus-visible{outline:3px solid white;outline-offset:4px}@media(max-width:600px){.sound{top:26px;right:26px;font-size:10px}}
</style><audio id="music" src="halloween.mp3" autoplay loop preload="auto"></audio><main id="cover"><button id="sound" class="sound" aria-pressed="false">Sound off · Enable music</button><img id="office" src="office-cover.jpg" alt="" aria-hidden="true"><div class="veil"></div><div class="frame"></div><section class="content"><div class="eyebrow">A Halloween Cybersecurity Experience</div><h1>THE MIDNIGHT<br>OFFICE</h1><p class="tagline">Three decisions stand between you<br>and a safe trip home.</p><button id="begin" class="start">Enter the office <span aria-hidden="true">→</span></button><p class="meta">3–5 MINUTES · SOUND RECOMMENDED</p><p id="status" class="status" role="status" hidden></p></section><div class="footer">PAUSE. VERIFY. REPORT.</div></main><script>

const music=document.getElementById('music'),sound=document.getElementById('sound');let fadeTimer=null,leaving=false;music.volume=.28;function soundLabel(){const on=!music.paused;sound.textContent=on?'Sound on · Mute':'Sound off · Enable music';sound.setAttribute('aria-pressed',String(on))}music.play().then(soundLabel).catch(()=>{soundLabel()});sound.onclick=async()=>{if(leaving)return;if(music.paused){try{await music.play()}catch(e){document.getElementById('status').hidden=false;document.getElementById('status').textContent='Audio could not play. You can continue without sound.'}}else music.pause();soundLabel()};function fadeOut(){return new Promise(resolve=>{if(music.paused){resolve();return}const initial=music.volume,start=performance.now();fadeTimer=setInterval(()=>{const progress=Math.min((performance.now()-start)/1400,1);music.volume=initial*(1-progress);if(progress===1){clearInterval(fadeTimer);music.pause();soundLabel();resolve()}},40)})}document.getElementById('begin').onclick=async()=>{if(leaving)return;leaving=true;await fadeOut();window.parent.postMessage({type:'MIDNIGHT_COVER_START'},'*');document.getElementById('status').hidden=false;document.getElementById('status').textContent='Standalone preview: the music has faded out. Connect the start button in Storyline to continue to the office.';leaving=false;music.volume=.28;};
window.addEventListener('message',e=>{if(e.source===window.parent&&e.data&&e.data.type==='MIDNIGHT_COVER_ACK'){document.getElementById('status').hidden=true;document.getElementById('cover').classList.add('exit')}});</script></html>
