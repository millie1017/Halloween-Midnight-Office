<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Before You Go</title><style>*{box-sizing:border-box}body{margin:0;color:#e6e2db;background:#05080b;font-family:Arial,sans-serif}main{height:100svh;min-height:450px;position:relative;display:grid;place-items:center;background:radial-gradient(ellipse at center,#192029 0%,#05080b 72%)}main:before{content:"";position:absolute;inset:22px;border:1px solid #ffffff08;pointer-events:none}.content{position:relative;text-align:center;width:90%;padding:35px 15px}.eyebrow{font-size:10px;letter-spacing:.23em;color:#d4a274;animation:arrive 1s .1s both}h1{font:normal clamp(34px,5.5vw,66px) Georgia,serif;letter-spacing:.065em;margin:27px 0 22px;text-shadow:0 0 24px #c9d4df20;animation:arrive 1.7s .3s both}.description{font-size:clamp(14px,1.7vw,18px);line-height:1.8;color:#b4bec9;margin:0;animation:arrive 1.5s 1s both}.meta{font-size:10px;letter-spacing:.14em;color:#909ba7;margin-top:22px;animation:arrive 1.5s 1.3s both}.start{font:14px Arial,sans-serif;letter-spacing:.06em;color:#181510;background:#efb67e;border:1px solid #efb67e;border-radius:4px;padding:16px 26px;cursor:pointer;margin-top:32px;animation:arrive 1.3s 1.7s both;transition:background .25s}.start:hover{background:#ffd3a7}.start:focus-visible{outline:2px solid white;outline-offset:5px}.start:disabled{cursor:wait}.status{font-size:12px;color:#c4cdd5;line-height:1.6;margin:18px auto 0;max-width:430px}.footer{position:absolute;bottom:32px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.2em;color:#74808b}[hidden]{display:none!important}@keyframes arrive{from{opacity:0;transform:translateY(5px);filter:blur(3px)}to{opacity:1;transform:none;filter:blur(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><main><section class="content"><div class="eyebrow">THE MIDNIGHT OFFICE</div><h1>Before you go.</h1><p class="description">You handled the unexpected.<br>One final security check, then you’re on your way.</p><p class="meta">3 QUESTIONS · 10 POINTS</p><button id="begin" class="start">Begin final check →</button><p id="status" class="status" role="status" hidden></p></section><div class="footer">PAUSE. VERIFY. PROTECT.</div></main><script>const button=document.getElementById('begin'),status=document.getElementById('status');let pending=false;button.onclick=()=>{if(pending)return;pending=true;button.disabled=true;window.parent.postMessage({type:'MIDNIGHT_QUIZ_START'},'*');setTimeout(()=>{pending=false;button.disabled=false;status.hidden=false;status.textContent='Standalone preview: connect this button to Quiz question 1 in Storyline.'},1800)};</script></html>
