<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final Security Challenge</title><style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#edf0f3;font-family:Arial,sans-serif}main{min-height:100svh;padding:clamp(24px,4vw,56px) max(5vw,22px);display:flex;flex-direction:column;justify-content:center}.wrap{width:min(100%,1050px);margin:auto}.top{display:flex;justify-content:space-between;gap:20px;padding-bottom:20px;border-bottom:1px solid #77838f40;color:#b7c1cc;font-size:12px;letter-spacing:.12em}.progress{height:2px;background:#26333f;margin-top:-1px}.progress span{display:block;height:100%;background:#f0ab6e;transition:width .3s}h1{font-size:clamp(30px,4.1vw,48px);line-height:1.15;color:#f0ab6e;margin:35px 0 22px;letter-spacing:-.025em}.question{font-size:clamp(18px,2.15vw,25px);line-height:1.5;margin:0 0 30px;max-width:950px}.choices{display:grid;gap:13px}.choice{width:100%;display:flex;align-items:center;gap:18px;text-align:left;background:#1b2732;color:#edf0f3;border:1px solid #64738199;border-radius:10px;padding:19px 23px;font:clamp(16px,1.9vw,21px)/1.45 Arial,sans-serif;cursor:pointer;min-height:76px;transition:background .2s,border .2s}.choice:hover:not(:disabled){background:#263541;border-color:#aebac6}.choice[aria-checked=true]{border-color:#f0ab6e;background:#342b26;box-shadow:inset 3px 0 #f0ab6e}.radio{width:20px;height:20px;flex:0 0 20px;border:1.5px solid #b3bec9;border-radius:50%;display:grid;place-items:center}.choice[aria-checked=true] .radio{border-color:#f0ab6e}.choice[aria-checked=true] .radio:after{content:"";width:10px;height:10px;background:#f0ab6e;border-radius:50%}.letter{font-size:15px;color:#aeb9c4;min-width:12px}.choice:disabled{cursor:default;opacity:.8}.bottom{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:26px;flex-wrap:wrap}.hint{color:#9daab7;font-size:13px}.primary,.secondary{font:600 16px Arial,sans-serif;padding:15px 24px;min-height:50px;border-radius:7px;cursor:pointer}.primary{background:#f0ab6e;color:#161c22;border:1px solid #f0ab6e}.primary:disabled{opacity:.35;cursor:default}.secondary{background:none;border:1px solid #677685;color:#dce3eb}button:focus-visible{outline:3px solid #ffe2c5;outline-offset:4px}.feedback{margin-top:25px;border-left:3px solid #f0ab6e;padding:20px 23px;background:#1b2732;border-radius:0 8px 8px 0}.feedback h2{font-size:20px;margin:0 0 10px}.feedback p{font-size:17px;line-height:1.6;color:#c5ced8;margin:0}.results{padding:15px 0}.score{font-size:clamp(60px,10vw,105px);font-family:Georgia,serif;margin:28px 0 20px}.score span{font:20px Arial,sans-serif;color:#98a5b2}.summary{color:#c5ced8;line-height:1.7;font-size:18px;max-width:690px}.result-list{list-style:none;padding:0;margin:26px 0;display:grid;gap:12px}.result-list li{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #60718240;padding:12px 0;color:#c5ced8}.result-list small{color:#f0ab6e}.status{font-size:13px;line-height:1.5;color:#c4ced9}[hidden]{display:none!important}@media(max-width:600px){.choice{gap:10px;padding:16px 14px}.top{font-size:10px}.question{margin-bottom:22px}h1{margin-top:27px}.feedback p{font-size:16px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}.sound-controls{display:flex;align-items:center;gap:20px}.sound-toggle{font:11px Arial,sans-serif;color:#b7c1cc;border:1px solid #64738166;background:none;border-radius:5px;padding:7px 10px;cursor:pointer}@media(max-width:600px){.sound-controls{gap:10px}} </style><main><div class="wrap"><header class="top"><span>FINAL SECURITY CHALLENGE</span><div class="sound-controls"><button id="ambient-toggle" class="sound-toggle" aria-pressed="false">Ambience off</button><button id="sound-toggle" class="sound-toggle" aria-pressed="true">Sound on</button><span id="counter">01 / 03</span></div></header><div class="progress" aria-hidden="true"><span id="progress"></span></div><section id="question-page" aria-labelledby="title"><h1 id="title" tabindex="-1"></h1><p class="question" id="question"></p><div class="choices" id="choices" role="radiogroup" aria-labelledby="question"></div><div class="feedback" id="feedback" role="status" hidden><h2 id="feedback-title"></h2><p id="feedback-body"></p></div><div class="bottom"><span class="hint" id="hint">Choose one answer.</span><button class="primary" id="submit" disabled>Submit →</button><button class="primary" id="next" hidden>Next question →</button></div></section><section class="results" id="results" hidden aria-labelledby="result-title"><h1 id="result-title" tabindex="-1"></h1><p class="summary" id="result-description"></p><div class="score"><b id="score"></b><span> / 10</span></div><ul class="result-list" id="result-list"></ul><div class="bottom"><span class="hint" id="pass-rule"></span><button class="primary" id="finish" hidden>Exit safely →</button><button class="primary" id="retry">Retry challenge →</button></div><p class="status" id="status" role="status" hidden></p></section></div></main><script>
let soundContext,soundEnabled=true;const soundToggle=document.getElementById('sound-toggle');soundToggle.onclick=()=>{soundEnabled=!soundEnabled;soundToggle.textContent=soundEnabled?'Sound on':'Sound off';soundToggle.setAttribute('aria-pressed',String(soundEnabled));if(soundEnabled)beep('select')};function beep(kind){if(!ambientMuted&&!ambientRunning)enableAmbient();if(!soundEnabled)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!soundContext)soundContext=new AC();const ctx=soundContext;function tone(freq,offset,length,volume){const oscillator=ctx.createOscillator(),gain=ctx.createGain(),start=ctx.currentTime+offset;oscillator.type='sine';oscillator.frequency.value=freq;gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(volume,start+.006);gain.gain.exponentialRampToValueAtTime(.0001,start+length);oscillator.connect(gain);gain.connect(ctx.destination);oscillator.start(start);oscillator.stop(start+length+.015);oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()}}function play(){if(kind==='submit'){tone(640,0,.08,.055);tone(820,.075,.10,.045)}else tone(720,0,.065,.05)}if(ctx.state==='suspended')ctx.resume().then(play).catch(()=>{});else if(ctx.state==='running')play()}catch(e){}}window.addEventListener('pagehide',()=>{if(soundContext)soundContext.suspend()});
let ambientContext,ambientGain,ambientSource,ambientRunning=false,ambientMuted=false;const ambientButton=document.getElementById('ambient-toggle');function ambientLabel(){ambientButton.textContent=ambientRunning&&!ambientMuted?'Ambience on':'Ambience off';ambientButton.setAttribute('aria-pressed',String(ambientRunning&&!ambientMuted))}async function enableAmbient(){if(ambientMuted)return;try{if(!ambientContext){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ambientContext=new AC();ambientGain=ambientContext.createGain();ambientGain.gain.value=0;ambientGain.connect(ambientContext.destination);const duration=16,sr=ambientContext.sampleRate,buffer=ambientContext.createBuffer(2,sr*duration,sr);for(let channel=0;channel<2;channel++){const data=buffer.getChannelData(channel);let last=0;for(let i=0;i<data.length;i++){last=(last+.02*(Math.random()*2-1))/1.02;data[i]=last*2.8;}const cross=sr;for(let i=0;i<cross;i++){const mix=i/cross;data[data.length-cross+i]=data[data.length-cross+i]*(1-mix)+data[i]*mix;}}ambientSource=ambientContext.createBufferSource();ambientSource.buffer=buffer;ambientSource.loop=true;const filter=ambientContext.createBiquadFilter();filter.type='lowpass';filter.frequency.value=420;ambientSource.connect(filter);filter.connect(ambientGain);ambientSource.start();[55,82.5,110].forEach((frequency,i)=>{const oscillator=ambientContext.createOscillator(),g=ambientContext.createGain();oscillator.type='sine';oscillator.frequency.value=frequency;g.gain.value=[.032,.009,.006][i];oscillator.connect(g);g.connect(ambientGain);oscillator.start();});}await ambientContext.resume();ambientRunning=ambientContext.state==='running';if(ambientRunning){ambientGain.gain.cancelScheduledValues(ambientContext.currentTime);ambientGain.gain.setTargetAtTime(.03,ambientContext.currentTime,.6)}ambientLabel()}catch(e){ambientRunning=false;ambientLabel()}}function pauseAmbient(){if(!ambientContext)return;ambientGain.gain.cancelScheduledValues(ambientContext.currentTime);ambientGain.gain.setTargetAtTime(0,ambientContext.currentTime,.15);ambientRunning=false;ambientLabel()}ambientButton.onclick=()=>{if(ambientRunning&&!ambientMuted){ambientMuted=true;pauseAmbient()}else{ambientMuted=false;enableAmbient()}};document.addEventListener('pointerdown',e=>{if(e.target!==ambientButton&&!ambientRunning&&!ambientMuted)enableAmbient()},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')if(e.target!==ambientButton&&!ambientRunning&&!ambientMuted)enableAmbient()});document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseAmbient();else if(!ambientMuted)enableAmbient()});window.addEventListener('pagehide',pauseAmbient);enableAmbient();

const questions=[{"title": "The party photo QR code.", "question": "A poster by the elevator says “Halloween party photos.” You scan its QR code, and the page asks you to sign in with your work account. What should you do before entering anything?", "choices": ["Sign in because the poster is inside the office.", "Close the page and verify the photo link with the organizer through a known company channel.", "Ask a coworker to sign in first to see whether it works."], "correct": 1, "points": 4, "feedback": "A QR code is another way to open a link—not proof that the destination is trustworthy. A poster can be replaced or altered. Close the page and confirm the photo-sharing link with the organizer through a trusted company channel before entering credentials."}, {"title": "A sign-in you didn’t start.", "question": "As you leave, your phone asks you to approve a sign-in to your work account. You have not tried to sign in. What is the safest response?", "choices": ["Approve it so the notification stops.", "Wait until morning; an approval request cannot signal a problem.", "Deny the request and report the unexpected activity through your official IT or security channel."], "correct": 2, "points": 3, "feedback": "Only approve sign-ins you initiated. An unexpected approval request can indicate an attempt to access your account. Deny it and report the activity through a known IT or security channel. Repeated requests are not a reason to approve."}, {"title": "You already entered your password.", "question": "You realize you entered your work password on a suspicious page. No error or warning appeared. What should you do now?", "choices": ["Stop using the page, contact IT or security immediately through a trusted channel, and follow the official account-recovery process.", "Close the page and wait for signs of misuse before reporting it.", "Return to the suspicious page and use its password-reset link."], "correct": 0, "points": 3, "feedback": "Report promptly, even if nothing unusual has happened yet. Tell IT or security that you entered your password, and follow their instructions to secure the account, including changing the exposed password through the genuine company service. Do not use the suspicious page’s recovery links. Reporting a mistake quickly helps limit harm."}];const $=id=>document.getElementById(id);let index=0,selected=null,answers=[],locked=false;const correctCount=()=>answers.filter((v,i)=>v===questions[i].correct).length;const score=()=>answers.reduce((sum,v,i)=>sum+(v===questions[i].correct?questions[i].points:0),0);function report(passed=false){window.parent.postMessage({type:'MIDNIGHT_FINAL_RESULT',score:score(),passed,answers:answers.slice()},'*')}function render(focus=false){const q=questions[index];selected=null;locked=false;$('question-page').hidden=false;$('results').hidden=true;$('feedback').hidden=true;$('submit').hidden=false;$('submit').disabled=true;$('next').hidden=true;$('hint').textContent='Choose one answer.';$('counter').textContent=String(index+1).padStart(2,'0')+' / 03';$('progress').style.width=(index/3*100)+'%';$('title').textContent=q.title;$('question').textContent=q.question;$('choices').replaceChildren();q.choices.forEach((text,i)=>{const b=document.createElement('button');b.className='choice';b.type='button';b.setAttribute('role','radio');b.setAttribute('aria-checked','false');b.tabIndex=i===0?0:-1;b.innerHTML='<span class="radio" aria-hidden="true"></span><span class="letter" aria-hidden="true">'+String.fromCharCode(65+i)+'</span><span></span>';b.lastChild.textContent=text;function select(){if(locked)return;if(selected!==i)beep('select');selected=i;[...$('choices').children].forEach((x,j)=>{x.setAttribute('aria-checked',String(j===i));x.tabIndex=j===i?0:-1});$('submit').disabled=false}b.onclick=select;b.onkeydown=e=>{if(locked)return;const keys={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1};if(e.key in keys){e.preventDefault();const target=(i+keys[e.key]+q.choices.length)%q.choices.length;$('choices').children[target].click();$('choices').children[target].focus()}};$('choices').append(b)});if(focus)$('title').focus()}
$('submit').onclick=()=>{if(selected===null||locked)return;beep('submit');locked=true;answers[index]=selected;const correct=selected===questions[index].correct;[...$('choices').children].forEach(b=>b.disabled=true);$('feedback-title').textContent=correct?'Good judgment.':'Here’s what to check.';$('feedback-body').textContent=questions[index].feedback;$('feedback').hidden=false;$('submit').hidden=true;$('next').hidden=false;$('next').textContent=index===2?'See your results →':'Next question →';$('hint').textContent='Decision recorded.';};$('next').onclick=()=>{if(!locked)return;if(index<2){index++;render(true)}else results()};function results(){const total=score(),passed=total===10;$('question-page').hidden=true;$('results').hidden=false;$('counter').textContent='RESULTS';$('progress').style.width='100%';$('result-title').textContent=passed?'You’re clear to leave.':'One more check before you go.';$('result-description').textContent=passed?'You checked a QR-code link, rejected an unexpected sign-in, and knew how to respond to an exposed password.':'Read the feedback, then try the three questions again. You need 10 / 10 to finish.';$('score').textContent=total;$('finish').hidden=!passed;$('retry').hidden=passed;$('pass-rule').textContent=correctCount()+' / 3 correct · Pass score: 10 / 10';$('status').hidden=true;$('result-list').replaceChildren();questions.forEach((q,i)=>{const li=document.createElement('li'),label=document.createElement('span'),value=document.createElement('small');label.textContent=q.title;value.textContent=(answers[i]===q.correct?q.points:0)+' / '+q.points;li.append(label,value);$('result-list').append(li)});report(passed);$('result-title').focus()}
$('retry').onclick=()=>{answers=[];index=0;window.parent.postMessage({type:'MIDNIGHT_FINAL_RESET'},'*');render(true)};let exitPending=false;$('finish').onclick=()=>{if(score()!==10||exitPending)return;exitPending=true;ambientMuted=true;pauseAmbient();report(true);window.parent.postMessage({type:'MIDNIGHT_FINAL_CONTINUE',score:10,passed:true},'*');setTimeout(()=>{exitPending=false;$('status').hidden=false;$('status').textContent='Standalone preview complete. In Storyline, connect FinalQuizDone to the Safe exit ending slide.'},1500)};render();
