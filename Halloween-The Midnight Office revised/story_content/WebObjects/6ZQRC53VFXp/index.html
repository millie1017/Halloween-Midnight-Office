<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Midnight Office — At the Door</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d13;color:#f4f5f7;font-family:Arial,sans-serif}main{height:100svh;min-height:540px;position:relative;overflow:auto;display:grid;place-items:center}video{position:absolute;width:100%;height:100%;object-fit:cover;inset:0}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,12,20,.96),rgba(6,12,20,.84) 58%,rgba(6,12,20,.58));opacity:0;transition:opacity .7s}.shade.on{opacity:1}.panel{position:relative;width:min(720px,90%);padding:36px 0;animation:appear .5s ease}header{color:#f5a65c;font-size:12px;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(28px,4vw,45px);line-height:1.1;margin:16px 0}p{color:#bfc8d5;line-height:1.6}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffbd79;outline-offset:4px}.choice{display:flex;align-items:center;gap:18px;width:100%;padding:19px 22px;margin:12px 0;text-align:left;color:#e8ecf2;background:#18232de8;border:1px solid #45515e;border-radius:12px;transition:.2s}.choice:hover{background:#263440;border-color:#b6c0cc}.choice[aria-pressed=true]{border-color:#f5a65c;background:#3b2d22;box-shadow:inset 3px 0 #f5a65c}.letter{font-size:12px;border:1px solid #65707b;border-radius:6px;padding:7px 9px;color:#f5a65c}.actions{display:flex;align-items:center;gap:20px;margin-top:24px;flex-wrap:wrap}.primary{border:0;border-radius:9px;background:#f5a65c;color:#17130f;font-weight:bold;padding:14px 25px}.primary:disabled{opacity:.4;cursor:default}.link{background:none;border:0;color:#d1d9e3;padding:12px;text-decoration:underline;text-underline-offset:5px}.card{background:#14202beb;border:1px solid #40505e;border-left:3px solid #f5a65c;border-radius:12px;padding:32px}.points{color:#f5a65c;font-size:14px}small{color:#a6b2c0}[hidden]{display:none!important}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:600px){main{min-height:640px}.panel{padding:24px 0}.choice{padding:15px}.card{padding:24px}}

#start{position:absolute;inset:0;width:100%;padding:30px;background:radial-gradient(ellipse at center,#192029 0%,#05080b 72%);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:5;animation:none;transition:opacity .75s}#start::before{content:"";position:absolute;inset:22px;border:1px solid #ffffff08;pointer-events:none}#start h1{font-family:Georgia,serif;font-weight:normal;font-size:clamp(28px,4vw,50px);letter-spacing:.08em;color:#e6e2db;text-shadow:0 0 24px #c9d4df20;animation:arrival 1.7s ease both}#start p{font-size:13px}#start .primary{margin-top:20px;background:transparent;color:#e1ac78;border:1px solid #8d68475c;letter-spacing:.12em;font-size:12px;text-transform:uppercase}#start.exiting{opacity:0;pointer-events:none}@keyframes arrival{from{opacity:0;transform:translateY(5px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}@media(prefers-reduced-motion:reduce){#start h1,.panel{animation:none}#start,.shade{transition:none}}
</style><main><video id="video" src="door.mp4" playsinline preload="auto"></video><div id="shade" class="shade on"></div>
<section id="start" class="panel"><h1>You’re almost out.</h1><p id="playback-status" role="status"></p><button id="play" class="primary" hidden>Continue →</button></section>
<section id="quiz" class="panel" hidden><header>Decision 02 / Office access</header><h1>Someone’s at the door.</h1><p>They gesture that they forgot their badge. How do you respond?</p><div role="group" aria-label="Answer choices"><button class="choice" data-choice="A" aria-pressed="false"><span class="letter">A</span><span>Let them in. They’re probably a coworker.</span></button><button class="choice" data-choice="B" aria-pressed="false"><span class="letter">B</span><span>Keep the door closed and contact security to verify their identity.</span></button><button class="choice" data-choice="C" aria-pressed="false"><span class="letter">C</span><span>Lend them your badge so they can get inside.</span></button></div><div class="actions"><button id="submit" class="primary" disabled>Submit decision →</button><button id="review" class="link">Watch again</button></div></section>
<section id="feedback" class="panel" hidden aria-live="polite"><div class="card"><header id="label"></header><h1 id="title"></h1><p id="body"></p><div class="points" id="points"></div><div class="actions"><button id="finish" class="primary">Finish this scene →</button></div></div></section>
<section id="done" class="panel" hidden><header>Scene complete</header><h1>Verify before you open.</h1><p>Be helpful without bypassing access procedures.</p><p id="score"></p><button id="restart" class="link">Try the scene again</button><p><small>Prototype: results are not yet connected to a learning platform.</small></p></section></main><script>
const $=id=>document.getElementById(id),v=$('video');let selected=null,review=false,result=null;const screens=['start','quiz','feedback','done'];function show(id){screens.forEach(s=>$(s).hidden=s!==id)}function questions(){show('quiz');$('shade').classList.add('on')}let openingTimer;function playbackError(message){clearTimeout(openingTimer);show('start');$('start').classList.remove('exiting');$('shade').classList.add('on');$('playback-status').textContent=message;$('play').hidden=false}async function play(){clearTimeout(openingTimer);v.currentTime=0;try{await v.play();$('start').classList.add('exiting');$('shade').classList.remove('on');setTimeout(()=>show('none'),750)}catch(e){playbackError(e.name==='NotAllowedError'?'Click to continue with sound.':'The video could not start. Check the video file and browser support.')}}$('play').onclick=play;v.onended=questions;v.onerror=()=>playbackError('This browser could not play the video. An H.264 MP4 export may be needed.');openingTimer=setTimeout(play,2400);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('submit').disabled=false});$('review').onclick=play;
const feedback={A:['A costume isn’t an ID.','Being inside the building does not mean someone is authorized to enter your office. Keep the door closed and follow the visitor verification process.'],B:['Helpful. Without taking the risk.','You can help without opening the door. Contact security through a trusted channel so they can verify the visitor’s identity.'],C:['Your badge stays with you.','Lending your badge gives someone access under your identity. Ask security to assist instead.']};$('submit').onclick=()=>{if(!selected)return;result={scene:'door',answer:selected,correct:selected==='B',score:selected==='B'?10:0,maxScore:10};$('label').textContent=result.correct?'Verified / Decision recorded':'Security debrief / Decision recorded';$('title').textContent=feedback[selected][0];$('body').textContent=feedback[selected][1];$('points').textContent=result.score+' / 10 points';$('finish').textContent=result.correct?'Exit safely →':'Try again →';window.parent.postMessage({type:'MIDNIGHT_DOOR_SCORE',score:result.score},'*');show('feedback');window.dispatchEvent(new CustomEvent('midnight-answer',{detail:result}))};$('finish').onclick=()=>{if(!result)return;if(!result.correct){selected=null;result=null;$('submit').disabled=true;document.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed','false'));questions();return;}window.parent.postMessage({type:'MIDNIGHT_DOOR_CONTINUE',score:10},'*');};$('restart').onclick=()=>{selected=null;result=null;$('submit').disabled=true;document.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed','false'));play()};
</script></html>
