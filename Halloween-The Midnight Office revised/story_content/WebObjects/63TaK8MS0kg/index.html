<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safe Exit — The Midnight Office</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080d13;color:#eee9e1;font-family:Arial,sans-serif}main{position:relative;min-height:540px;height:100svh;overflow:hidden;display:grid;place-items:center}.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.65);opacity:.42}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#080d13ed,#080d1399,#080d13b0),linear-gradient(0deg,#080d13,transparent 70%)}.frame{position:absolute;inset:24px;border:1px solid #ffffff10}.content{position:relative;text-align:center;max-width:850px;width:90%;padding:40px 12px}.eyebrow{color:#e5aa70;font-size:11px;letter-spacing:.25em;animation:arrive 1s both}h1{font:normal clamp(58px,9vw,118px) Georgia,serif;letter-spacing:.015em;margin:28px 0 12px;animation:arrive 1.6s .2s both}.holiday{font:normal clamp(25px,3.7vw,45px) Georgia,serif;color:#efbc8a;margin:0 0 32px;animation:arrive 1.6s .6s both}.rule{width:52px;height:1px;background:#d9a06a88;margin:0 auto 26px}.closing{color:#c0c8cf;font-size:clamp(14px,1.6vw,18px);line-height:1.8;margin:0;animation:arrive 1.6s 1s both}.footer{position:absolute;bottom:35px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.2em;color:#929da7}.sound{position:absolute;right:40px;top:38px;z-index:2;color:#c8d1da;background:#101820cc;border:1px solid #ffffff2a;border-radius:4px;padding:10px 14px;font:12px Arial,sans-serif;cursor:pointer}.sound:focus-visible{outline:2px solid #efbc8a;outline-offset:4px}.audio-status{color:#aeb7c1;font-size:12px;line-height:1.5;margin-top:20px}button[hidden],p[hidden]{display:none}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:600px){main{min-height:480px}.frame{inset:15px}.sound{right:26px;top:26px}.footer{font-size:8px;bottom:25px}}</style><main><img class="background" src="office.jpg" alt=""><div class="veil"></div><div class="frame"></div><audio id="music" src="halloween.mp3" autoplay loop preload="auto"></audio><button id="sound" class="sound" hidden>Play music ♫</button><section class="content"><div class="eyebrow">THE MIDNIGHT OFFICE · COMPLETE</div><h1>Safe exit.</h1><p class="holiday">Happy Halloween.</p><div class="rule"></div><p class="closing">Stay curious. Stay cautious.<br>And get home safely.</p><p id="status" class="audio-status" role="status" hidden></p></section><div class="footer">PAUSE. VERIFY. PROTECT.</div></main><script>const music=document.getElementById('music'),button=document.getElementById('sound'),status=document.getElementById('status');music.volume=.28;let fade;function update(){button.hidden=false;button.textContent=music.paused?'Play music ♫':'Mute music';button.setAttribute('aria-label',music.paused?'Play background music':'Mute background music')}async function start(){try{await music.play();status.hidden=true;update()}catch(e){update();if(e.name!=='NotAllowedError'){status.hidden=false;status.textContent='Music is unavailable. You can still view the ending.'}}}button.onclick=()=>{if(music.paused)start();else{music.pause();update()}};music.addEventListener('error',()=>{status.hidden=false;status.textContent='Music is unavailable. You can still view the ending.';button.hidden=true});start();window.addEventListener('pagehide',()=>music.pause());</script></html>
